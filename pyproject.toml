[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ukcase"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9",
    "sqlalchemy>=2.0",
    "httpx>=0.24",
    "feedparser>=6.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "redis>=5.0",
    "rq>=1.15",
]

[project.scripts]
ukcase = "app.cli:app"
ukcase-worker = "app.workers.worker:main"
